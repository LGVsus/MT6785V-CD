name: Compile Kernel Config & DTBS

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            git \
            ccache \
            python3

      - name: Setup Toolchain (GCC for arm64)
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu clang lld

      - name: Configure Kernel (defconfig)
        run: |
          make ARCH=arm64 LLVM=1 olddefconfig

      - name: Build Device Trees (dtbs)
        run: |
          make ARCH=arm64 LLVM=1 mediatek/mt6785-xiaomi-maltose.dtb
          ls -l arch/arm64/boot/dts/mediatek/mt6785-xiaomi-maltose.dtb

      - name: Archive generated DTBS and Config
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dtbs-and-config
          path: |
            .config
            arch/arm64/boot/dts/mediatek/*.dtb
