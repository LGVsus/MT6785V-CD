name: Compile Kernel Config & DTBS

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            git \
            ccache \
            python3

      - name: Setup Toolchain (GCC for arm64)
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu clang lld

      - name: Configure kernel
        run: |
          cp configs/config-postmarketos-mediatek-mt6785.aarch64 .config
          scripts/config -e DRM -e DRM_SIMPLEDRM -e PSTORE_PMSG
          make ARCH=arm64 LLVM=1 olddefconfig
          
      - name: Archive generated DTBS and Config
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dtbs-and-config
          path: |
            .config
            arch/arm64/boot/dts/mediatek/*.dtb
