name: Compile Kernel

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            git \
            ccache \
            python3

      - name: Setup Toolchain (GCC for arm64)
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu clang lld llvm bc flex bison libssl-dev libelf-dev

      - name: Configure kernel
        run: |
          cp configs/config-postmarketos-mediatek-mt6785.aarch64 .config
          scripts/config -e DRM -e DRM_SIMPLEDRM -e PSTORE_PMSG
          make ARCH=arm64 LLVM=1 -k -j$(nproc) Image.gz mediatek/mt6785-xiaomi-maltose.dtb 2>&1 | tee build.log
          grep -E "CONFIG_DRM_SIMPLEDRM|CONFIG_PSTORE_RAM|CONFIG_PSTORE_PMSG" .config

      - name: Compile kernel
        run: |
          make ARCH=arm64 LLVM=1 -j$(nproc) Image.gz mediatek/mt6785-xiaomi-maltose.dtb
          cp .config kernel.config

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-mt6785
          if-no-files-found: error
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/mediatek/mt6785-xiaomi-maltose.dtb
            kernel.config
